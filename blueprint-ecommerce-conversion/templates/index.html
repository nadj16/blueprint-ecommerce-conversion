<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion & Génération - Webild Clone</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #fafafa; 
            color: #111111; 
            display: flex; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: center;
        }
        .auth-card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 440px; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.05);
            border: 1px solid #ededed;
        }
        .header-zone { text-align: center; margin-bottom: 32px; }
        .logo-placeholder { font-weight: 700; font-size: 22px; letter-spacing: -0.5px; margin-bottom: 16px; color: #000; }
        .header-zone h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; color: #111; }
        .header-zone p { font-size: 14px; color: #666; line-height: 1.5; }
        
        .btn-google { 
            width: 100%; 
            padding: 12px 16px; 
            background: #ffffff; 
            border: 1px solid #e0e0e0; 
            color: #333333; 
            font-size: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 500; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn-google:hover { background: #f7f7f7; border-color: #cccccc; }
        .btn-google:disabled { background: #f5f5f5; color: #999; cursor: not-allowed; border-color: #e0e0e0; }
        
        .separator { 
            display: flex; 
            align-items: center; 
            text-align: center; 
            margin: 24px 0; 
            color: #8c8c8c; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .separator::before, .separator::after { 
            content: ''; 
            flex: 1; 
            border-bottom: 1px solid #eeeeee; 
        }
        .separator:not(:empty)::before { margin-right: .5em; }
        .separator:not(:empty)::after { margin-left: .5em; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #333; }
        input[type="text"] { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 14px; 
            background-color: #fff;
            color: #111;
            transition: border-color 0.2s, box-shadow 0.2s; 
        }
        input[type="text"]:focus { border-color: #000000; box-shadow: 0 0 0 2px rgba(0,0,0,0.05); outline: none; }
        
        .error-msg { 
            color: #e53e3e; 
            font-size: 13px; 
            text-align: center; 
            margin-top: 16px; 
            padding: 10px;
            background: #fff5f5;
            border-radius: 6px;
            display: none; 
        }
        .loading { 
            text-align: center; 
            display: none; 
            color: #111; 
            font-size: 14px;
            font-weight: 500; 
            margin-top: 20px; 
        }
        
        .footer-link { text-align: center; margin-top: 24px; font-size: 13px; color: #666; }
        .footer-link a { color: #000; text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="header-zone">
            <div class="logo-placeholder">⚡ Webild Clone</div>
            <h2>Créer votre compte</h2>
            <p>Démarrez dès aujourd'hui et laissez l'IA générer votre site web sur-mesure.</p>
        </div>
        
        <form id="generatorForm">
            <div class="form-group">
                <label for="theme">De quoi parle votre site web ?</label>
                <input type="text" id="theme" placeholder="Ex: Maillots de foot vintage, Agence Web..." required>
            </div>

            <button type="submit" id="submitBtn" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.84 2.07-1.79 2.71v2.25h2.91c1.7-1.56 2.68-3.87 2.68-6.61z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.25c-.81.54-1.85.87-3.05.87-2.34 0-4.33-1.58-5.04-3.71H.92v2.33C2.4 15.97 5.46 18 9 18z" fill="#34A853"/>
                    <path d="M3.96 10.73A5.41 5.41 0 0 1 3.6 9c0-.6.1-1.19.27-1.73V4.94H.92A8.99 8.99 0 0 0 0 9c0 1.46.35 2.85.92 4.06l3.04-2.33z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.4A8.99 8.99 0 0 0 0 9l3.04 2.33C3.75 5.17 5.74 3.58 9 3.58z" fill="#EA4335"/>
                </svg>
                Continuer avec Google
            </button>
        </form>

        <div class="separator">ou alternative</div>
        
        <div style="font-size: 13px; text-align: center; color: #8c8c8c; margin-bottom: 5px;">
            La connexion sociale est requise pour générer l'architecture.
        </div>
        
        <div id="errorBox" class="error-msg"></div>
        <div id="loadingBox" class="loading">Génération de l'architecture par l'IA... ⏳</div>

        <div class="footer-link">
            Vous avez déjà un compte ? <a href="#">Se connecter</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://spwrqwjhxjmnzszcstpm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwd3Jxd2poeGptbnpzemNzdHBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzA5NzksImV4cCI6MjA5NTkwNjk3OX0.PZKgsNZ0u0fPeSI_S5xd_AScoCKHfBQtceNZkXTTFtY";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('generatorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const themeValue = document.getElementById('theme').value;
            localStorage.setItem('pending_theme', themeValue);

            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin 
                }
            });

            if (error) {
                document.getElementById('errorBox').innerText = "Erreur : " + error.message;
                document.getElementById('errorBox').style.display = 'block';
            }
        });

        async function checkSessionAndGenerate() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const pendingTheme = localStorage.getItem('pending_theme');

            if (session && pendingTheme) {
                localStorage.removeItem('pending_theme');

                document.getElementById('theme').value = pendingTheme;
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('loadingBox').style.display = 'block';

                try {
                    const formData = new FormData();
                    formData.append('theme', pendingTheme);

                    const response = await fetch('/generate', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error("Erreur de l'API de génération.");

                    const htmlResult = await response.text();
                    document.body.innerHTML = htmlResult;

                } catch (err) {
                    document.getElementById('errorBox').innerText = err.message;
                    document.getElementById('errorBox').style.display = 'block';
                    document.getElementById('loadingBox').style.display = 'none';
                    document.getElementById('submitBtn').disabled = false;
                }
            }
        }

        window.addEventListener('load', checkSessionAndGenerate);
    </script>
</body>
</html>
